const WG={"bus": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>How up to date is the bus info?<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5f7;--card:#fff;--ink:#12263a;--mut:#4d6272;--line:#cfd9e0;--teal:#0b7a75;--yel:#f5b700;--red:#c8372d;--ok:#1f8a4c;--tint:#e3eef0;color-scheme:light dark}\n@media(prefers-color-scheme:dark){:root{--bg:#0d1a26;--card:#14263a;--ink:#e8eef3;--mut:#9db0bf;--line:#2a4157;--teal:#3cc4bb;--red:#ff7a6e;--ok:#4cc57f;--tint:#1a3347}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:820px;margin:0 auto;padding:28px 18px 60px}\nh1{font-size:2rem;line-height:1.15;margin:0 0 10px}\nh2{font-size:1.4rem;margin:44px 0 8px;padding-top:20px;border-top:4px solid var(--yel)}\np{max-width:66ch;margin:.4em 0 .9em}\n.mut{color:var(--mut)}\nbutton{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700}\nbutton:hover{background:var(--tint)}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}\n.map{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}\nsvg{display:block;width:100%;height:auto}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}\n.ctl label{display:flex;justify-content:space-between;font-weight:700}\n.ctl output{color:var(--teal)}\n.ctl input[type=range]{width:100%;accent-color:var(--teal);margin:6px 0}\n.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}\n.read div{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ok);border-radius:8px;padding:10px 12px}\n.read div[data-s=warn]{border-top-color:var(--yel)}.read div[data-s=bad]{border-top-color:var(--red)}\n.read span{display:block;font-size:.85rem;color:var(--mut)}\n.read b{font-size:1.5rem;line-height:1.2}\n#say{padding:12px 16px;border-radius:8px;border-left:6px solid var(--ok);background:var(--card);font-weight:700;min-height:3.6em}\n#say[data-s=warn]{border-left-color:var(--yel)}#say[data-s=bad]{border-left-color:var(--red)}\n.key{background:var(--yel);color:#12263a;border-radius:8px;padding:12px 16px;font-weight:700;margin:16px 0;max-width:66ch}\n.q{border-top:1px solid var(--line);padding:14px 0}\n.q p{margin:0 0 8px}\n.q textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical;margin-bottom:8px}\n.ans{margin-top:10px;padding:10px 14px;border-radius:8px;border-left:6px solid var(--ok);background:var(--card)}\n.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>How up to date is the bus info?<\/h1>\n<p>Your bus app can’t see the bus. The bus sends its location every so often, and the app shows the last one it received. Change how often the bus reports and watch the app fall behind.<\/p>\n\n<div class=\"map\"><svg id=\"svg\" viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"A bus driving along a road and the delayed position the app shows\"><\/svg><\/div>\n\n<div class=\"ctl\" style=\"margin-top:14px\">\n  <label for=\"g\">The bus reports its location every <output id=\"og\">10 s<\/output><\/label>\n  <input type=\"range\" id=\"g\" min=\"5\" max=\"120\" step=\"5\" value=\"10\">\n  <p class=\"mut\" id=\"cap\" style=\"margin:0\"><\/p>\n<\/div>\n<div class=\"row\">\n  <button data-g=\"5\">Every 5 seconds<\/button>\n  <button data-g=\"30\">Every 30 seconds<\/button>\n  <button data-g=\"120\">Every 2 minutes<\/button>\n  <button id=\"play\" style=\"margin-left:auto\">Pause<\/button>\n  <button id=\"restart\">Restart<\/button>\n<\/div>\n\n<div class=\"read\">\n  <div id=\"c1\"><span>Age of the info on screen<\/span><b id=\"age\">0 s<\/b><\/div>\n  <div id=\"c2\"><span>App’s dot is behind by<\/span><b id=\"gap\">0 m<\/b><\/div>\n  <div id=\"c3\"><span>App says bus arrives in<\/span><b id=\"eta\">–<\/b><\/div>\n  <div id=\"c4\"><span>Bus really arrives in<\/span><b id=\"real\">–<\/b><\/div>\n<\/div>\n<div id=\"say\" aria-live=\"polite\"><\/div>\n<div class=\"key\">Key lesson: the app can only show what the bus last told it. The longer since the last report, the more out of date the dot is.<\/div>\n\n<\/main>\n\n<script>\nvar V=10,LEN=1500,STOP=1000,T=150,CYCLE=170,SPEED=10;\nvar g=10,t=0,run=true,last=0;\nvar gs=document.getElementById('g'),svg=document.getElementById('svg');\nfunction X(m){return 30+m/LEN*580;}\nfunction mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}\nfunction band(age){return age<10?'ok':age<40?'warn':'bad';}\nfunction frame(ts){\n  var dt=Math.min((ts-last)/1000,0.1);last=ts;\n  if(run)t+=dt*SPEED;\n  var tt=t%CYCLE,tc=Math.min(tt,T);\n  var rep=Math.floor(tc/g)*g,bus=tc*V,app=rep*V,age=tc-rep,gap=bus-app;\n  var bx=X(bus),ax=X(app),sx=X(STOP),fresh=age<3&&tc>0&&tc<T;\n  var s='<line x1=\"30\" y1=\"110\" x2=\"610\" y2=\"110\" stroke=\"var(--line)\" stroke-width=\"12\" stroke-linecap=\"round\"/>';\n  s+='<text x=\"30\" y=\"138\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--mut)\">Start<\/text><text x=\"610\" y=\"138\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--mut)\">End<\/text>';\n  s+='<line x1=\"'+sx+'\" y1=\"58\" x2=\"'+sx+'\" y2=\"104\" stroke=\"var(--ink)\" stroke-width=\"3\"/><circle cx=\"'+sx+'\" cy=\"54\" r=\"9\" fill=\"var(--teal)\"/>';\n  s+='<text x=\"'+sx+'\" y=\"34\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--ink)\">You wait here<\/text>';\n  if(gap>=8){\n    s+='<line x1=\"'+ax+'\" y1=\"168\" x2=\"'+bx+'\" y2=\"168\" stroke=\"var(--red)\" stroke-width=\"3\" stroke-dasharray=\"5 5\"/>';\n    s+='<line x1=\"'+ax+'\" y1=\"160\" x2=\"'+ax+'\" y2=\"176\" stroke=\"var(--red)\" stroke-width=\"3\"/><line x1=\"'+bx+'\" y1=\"160\" x2=\"'+bx+'\" y2=\"176\" stroke=\"var(--red)\" stroke-width=\"3\"/>';\n    s+='<text x=\"'+((ax+bx)/2)+'\" y=\"194\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--red)\">'+Math.round(gap)+' m behind<\/text>';\n  }\n  s+='<circle cx=\"'+ax+'\" cy=\"110\" r=\"15\" fill=\"'+(fresh?'var(--teal)':'none')+'\" fill-opacity=\"0.35\" stroke=\"var(--teal)\" stroke-width=\"3\" stroke-dasharray=\"4 3\"/>';\n  s+='<text x=\"'+ax+'\" y=\"146\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--teal)\">App shows<\/text>';\n  s+='<rect x=\"'+(bx-18)+'\" y=\"98\" width=\"36\" height=\"22\" rx=\"6\" fill=\"#f5b700\" stroke=\"#12263a\" stroke-width=\"3\"/><circle cx=\"'+(bx-9)+'\" cy=\"122\" r=\"4\" fill=\"#12263a\"/><circle cx=\"'+(bx+9)+'\" cy=\"122\" r=\"4\" fill=\"#12263a\"/>';\n  s+='<text x=\"'+bx+'\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\">Real bus<\/text>';\n  svg.innerHTML=s;\n  var st=band(age);\n  document.getElementById('age').textContent=Math.round(age)+' s';\n  document.getElementById('gap').textContent=Math.round(gap)+' m';\n  document.getElementById('c1').dataset.s=st;document.getElementById('c2').dataset.s=st;\n  var appPast=app>=STOP,busPast=bus>=STOP;\n  document.getElementById('eta').textContent=appPast?'Arrived':mmss((STOP-app)/V);\n  document.getElementById('real').textContent=busPast?'Already left':mmss((STOP-bus)/V);\n  var box=document.getElementById('say'),msg,ms;\n  if(busPast&&!appPast){msg='The bus has already left your stop, but the app still says it is coming. You would wait for a bus that is not there.';ms='bad';}\n  else if(st==='ok'){msg='The info is fresh. The app and the real bus are very close together.';ms='ok';}\n  else if(st==='warn'){msg='The app is a bit behind. The bus has moved on since its last report.';ms='warn';}\n  else{msg='The info is old. The bus is a long way from where the app thinks it is.';ms='bad';}\n  box.textContent=msg;box.dataset.s=ms;\n  requestAnimationFrame(frame);\n}\nfunction setG(v){g=+v;gs.value=v;document.getElementById('og').textContent=v+' s';\n  document.getElementById('cap').textContent='At this setting the app’s dot can be up to '+(g*V)+' m behind the real bus.';}\ngs.addEventListener('input',function(){setG(gs.value);});\ndocument.querySelectorAll('button[data-g]').forEach(function(b){b.addEventListener('click',function(){setG(b.dataset.g);t=0;});});\ndocument.getElementById('play').addEventListener('click',function(){run=!run;this.textContent=run?'Pause':'Play';});\ndocument.getElementById('restart').addEventListener('click',function(){t=0;});\nsetG(10);requestAnimationFrame(function(ts){last=ts;frame(ts);});\n\n<\/script>\n<script>(function(){function s(){parent.postMessage({wh:document.documentElement.scrollHeight,id:\"bus\"},\"*\")}addEventListener(\"load\",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);setInterval(s,700)})()<\/script><\/body>\n<\/html>\n", "sun": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Outliers in the sunflower garden<\/title>\n<style>\n:root{--bg:#ffffff;--fg:#1c2218;--muted:#5d6657;--faint:#8a9284;--line:#dfe3d9;--strong:#b9c0b0;--surface:#f4f6ef;--info-bg:#e8f0fb;--info-fg:#1d4a82;--accent:#f2a900;--ok-bg:#eaf3de;--ok-fg:#2b5410}\n@media (prefers-color-scheme:dark){:root{--bg:#161a14;--fg:#eef1e8;--muted:#b4bbab;--faint:#818a78;--line:#2d3329;--strong:#4a5343;--surface:#1f251c;--info-bg:#1b2c45;--info-fg:#b9d4f6;--ok-bg:#223318;--ok-fg:#c7e3a6}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 \"Avenir Next\",\"Segoe UI\",system-ui,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:28px 18px 64px}\nh1{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:700}\nh2{font-size:21px;margin:44px 0 6px;font-weight:700}\n.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}\nbutton{font:inherit;font-size:15px;color:var(--fg);background:transparent;border:1px solid var(--strong);border-radius:8px;padding:6px 14px;cursor:pointer}\nbutton:hover{background:var(--surface)}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}\n.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 12px}\n.stat{background:var(--surface);border-radius:8px;padding:12px 14px}\n.stat small{display:block;font-size:13px;color:var(--muted)}\n.stat b{font-size:24px;font-weight:700}\n#msg{padding:12px 14px;border-radius:8px;background:var(--info-bg);color:var(--info-fg);font-size:15px}\n.q{border-top:1px solid var(--line);padding:16px 0}\n.q p{margin:0 0 10px}\n.q textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical;margin-bottom:8px}\n.ans{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--ok-bg);color:var(--ok-fg);font-size:15px}\n.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n@media (max-width:520px){.stats{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Outliers in the sunflower garden<\/h1>\n<p class=\"lead\">Eight sunflowers grew in the school garden. Seven grew to about the same height. The eighth is different, and you control how tall it gets. Watch what happens to the mean and the median.<\/p>\n\n<div class=\"row\" style=\"margin-bottom:8px\">\n  <svg id=\"plot\" viewBox=\"0 0 414 240\" role=\"img\" aria-label=\"Dot plot of sunflower heights with mean and median markers\" style=\"touch-action:none;display:block;flex:1 1 340px;min-width:0\"><\/svg>\n  <svg id=\"garden\" viewBox=\"0 0 250 244\" width=\"250\" height=\"244\" role=\"img\" aria-label=\"Drawing of eight sunflowers; the one on the right grows taller or shorter\" style=\"touch-action:none;display:block;flex:0 0 250px;max-width:100%\"><\/svg>\n<\/div>\n\n<div class=\"row\" style=\"align-items:center;margin:8px 0 12px\">\n  <label for=\"sl\" style=\"color:var(--muted);font-size:15px\">Height of the moving sunflower<\/label>\n  <input type=\"range\" id=\"sl\" min=\"0\" max=\"200\" step=\"1\" value=\"48\" style=\"flex:1;min-width:160px;accent-color:#d85a30\">\n  <b id=\"slv\" style=\"min-width:60px\">48 cm<\/b>\n<\/div>\n<div class=\"row\" style=\"align-items:center;margin:0 0 14px\">\n  <button data-v=\"48\">Typical<\/button>\n  <button data-v=\"80\">A bit taller<\/button>\n  <button data-v=\"200\">Giant sunflower<\/button>\n  <button data-v=\"5\">Tiny seedling<\/button>\n  <label style=\"margin-left:auto;font-size:15px\"><input type=\"checkbox\" id=\"inc\" checked> Include the moving sunflower<\/label>\n<\/div>\n\n<div class=\"stats\">\n  <div class=\"stat\"><small>Mean (balance point)<\/small><b id=\"mean\" style=\"color:#7f77dd\">0<\/b><\/div>\n  <div class=\"stat\"><small>Median (middle value)<\/small><b id=\"med\" style=\"color:#1d9e75\">0<\/b><\/div>\n  <div class=\"stat\"><small>Gap: mean minus median<\/small><b id=\"gap\">0<\/b><\/div>\n<\/div>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n\n<\/main>\n\n<script>\nvar base=[40,44,44,48,50,50,52];\nvar LO=35,HI=59;\nvar X0=20,X1=394,MAX=200,AX=170,R=8,GY=218,S=0.8;\nvar sl=document.getElementById('sl'),inc=document.getElementById('inc'),svg=document.getElementById('plot'),gd=document.getElementById('garden');\nfunction sx(v){return X0+(v/MAX)*(X1-X0);}\nfunction med(a){var s=a.slice().sort(function(p,q){return p-q;}),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}\nfunction mean(a){return a.reduce(function(p,q){return p+q;},0)/a.length;}\nfunction f(v){return (Math.round(v*10)/10).toFixed(1).replace('.0','')+' cm';}\nfunction setV(v){sl.value=v;draw();}\nfunction flower(x,h,ring){\n  var top=GY-h*S,s='';\n  s+='<line x1=\"'+x+'\" y1=\"'+GY+'\" x2=\"'+x+'\" y2=\"'+top+'\" stroke=\"#639922\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\n  if(h>28){var ly=GY-h*S*0.4;\n    s+='<ellipse cx=\"'+(x+7)+'\" cy=\"'+ly+'\" rx=\"7\" ry=\"3\" fill=\"#639922\" transform=\"rotate(-25 '+x+' '+ly+')\"/>';\n    s+='<ellipse cx=\"'+(x-7)+'\" cy=\"'+(ly-6)+'\" rx=\"7\" ry=\"3\" fill=\"#639922\" transform=\"rotate(25 '+x+' '+(ly-6)+')\"/>';}\n  for(var a=0;a<360;a+=30)s+='<ellipse cx=\"'+x+'\" cy=\"'+(top-6.5)+'\" rx=\"3.5\" ry=\"5.5\" fill=\"#ef9f27\" transform=\"rotate('+a+' '+x+' '+top+')\"/>';\n  s+='<circle cx=\"'+x+'\" cy=\"'+top+'\" r=\"5.5\" fill=\"#854f0b\"/>';\n  if(ring)s+='<circle cx=\"'+x+'\" cy=\"'+top+'\" r=\"15\" fill=\"none\" stroke=\"#d85a30\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/>';\n  return s;\n}\nfunction drawGarden(v,useO,isOut,m,md){\n  var s='',ym=GY-m*S,yd=GY-md*S,up=m>=md;\n  s+='<line x1=\"0\" y1=\"'+ym+'\" x2=\"250\" y2=\"'+ym+'\" stroke=\"#7f77dd\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>';\n  s+='<line x1=\"0\" y1=\"'+yd+'\" x2=\"250\" y2=\"'+yd+'\" stroke=\"#1d9e75\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>';\n  s+='<text x=\"2\" y=\"'+(up?ym-4:ym+13)+'\" font-size=\"12\" font-weight=\"600\" fill=\"#7f77dd\">mean<\/text>';\n  s+='<text x=\"2\" y=\"'+(up?yd+13:yd-4)+'\" font-size=\"12\" font-weight=\"600\" fill=\"#1d9e75\">median<\/text>';\n  s+='<line x1=\"0\" y1=\"'+GY+'\" x2=\"250\" y2=\"'+GY+'\" stroke=\"var(--strong)\" stroke-width=\"3\"/>';\n  for(var i=0;i<7;i++)s+=flower(56+i*25,base[i],false);\n  if(useO){\n    var ox=56+7*25;\n    s+=flower(ox,v,isOut);\n    s+='<rect id=\"oddgrab\" x=\"'+(ox-13)+'\" y=\"0\" width=\"26\" height=\"'+GY+'\" fill=\"transparent\" style=\"cursor:ns-resize\"/>';\n    if(isOut)s+='<text x=\"'+ox+'\" y=\"238\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" fill=\"#d85a30\">outlier<\/text>';\n  }\n  gd.innerHTML=s;\n}\nfunction draw(){\n  var v=+sl.value,useO=inc.checked,isOut=v<LO||v>HI;\n  var data=useO?base.concat([v]):base.slice();\n  var m=mean(data),md=med(data);\n  document.getElementById('slv').textContent=v+' cm';\n  var s='';\n  for(var t=0;t<=MAX;t+=20){s+='<line x1=\"'+sx(t)+'\" y1=\"'+AX+'\" x2=\"'+sx(t)+'\" y2=\"'+(AX+5)+'\" stroke=\"var(--strong)\"/><text x=\"'+sx(t)+'\" y=\"206\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--faint)\">'+t+'<\/text>';}\n  s+='<line x1=\"'+X0+'\" y1=\"'+AX+'\" x2=\"'+X1+'\" y2=\"'+AX+'\" stroke=\"var(--strong)\" stroke-width=\"3\"/>';\n  var items=base.map(function(b){return {x:sx(b),o:false};});\n  if(useO)items.push({x:sx(v),o:true});\n  var placed=[];\n  items.forEach(function(it){var r=0;while(placed.some(function(p){return p.r===r&&Math.abs(p.x-it.x)<2*R+1;}))r++;it.r=r;placed.push(it);});\n  placed.forEach(function(it){\n    var cy=AX-R-2-it.r*(2*R+1);\n    if(it.o)s+='<circle id=\"odd\" cx=\"'+it.x+'\" cy=\"'+cy+'\" r=\"'+(R+1)+'\" fill=\"#d85a30\" stroke=\"var(--bg)\" stroke-width=\"2\" style=\"cursor:grab\"/>';\n    else s+='<circle cx=\"'+it.x+'\" cy=\"'+cy+'\" r=\"'+R+'\" fill=\"#378add\" stroke=\"var(--bg)\" stroke-width=\"2\"/>';\n  });\n  if(useO&&isOut)s+='<text x=\"'+sx(v)+'\" y=\"'+(AX-R*2-14-placed[placed.length-1].r*17)+'\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" fill=\"#d85a30\">outlier<\/text>';\n  var mx=sx(md);\n  s+='<line x1=\"'+mx+'\" y1=\"52\" x2=\"'+mx+'\" y2=\"'+AX+'\" stroke=\"#1d9e75\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>';\n  s+='<text x=\"'+mx+'\" y=\"44\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#1d9e75\">median '+f(md)+'<\/text>';\n  var ax=sx(m);\n  s+='<polygon points=\"'+ax+','+(AX+4)+' '+(ax-13)+','+(AX+26)+' '+(ax+13)+','+(AX+26)+'\" fill=\"#7f77dd\"/>';\n  s+='<text x=\"'+ax+'\" y=\"'+(AX+66)+'\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7f77dd\">mean '+f(m)+'<\/text>';\n  svg.innerHTML=s;\n  drawGarden(v,useO,useO&&isOut,m,md);\n  document.getElementById('mean').textContent=f(m);\n  document.getElementById('med').textContent=f(md);\n  document.getElementById('gap').textContent=f(m-md);\n  var m0=mean(base),md0=med(base),box=document.getElementById('msg');\n  if(!useO)box.textContent='With just the seven similar sunflowers, the mean ('+f(m)+') and median ('+f(md)+') are close together. Both describe a typical sunflower well.';\n  else if(!isOut)box.textContent='The moving sunflower is still within the range of the others, so the mean and median both hardly move. Keep dragging it further away.';\n  else{\n    var dir=v>HI?'up':'down';\n    box.textContent='Now it is an outlier, a value far from the rest. It pulled the mean '+dir+' by '+f(Math.abs(m-m0))+', but the median only moved '+f(Math.abs(md-md0))+'. One extreme value drags the mean along. The median stays near the middle of the group.';\n  }\n}\nfunction clamp(v){return Math.max(0,Math.min(MAX,v));}\nfunction fromPlot(e){var r=svg.getBoundingClientRect();return clamp(Math.round(((e.clientX-r.left)/r.width*414-X0)/(X1-X0)*MAX));}\nfunction fromGarden(e){var r=gd.getBoundingClientRect();return clamp(Math.round((GY-(e.clientY-r.top)/r.height*244)/S));}\nvar drag=null;\nsvg.addEventListener('pointerdown',function(e){if(e.target.id==='odd'){drag='p';svg.setPointerCapture(e.pointerId);}});\nsvg.addEventListener('pointermove',function(e){if(drag==='p'){sl.value=fromPlot(e);draw();}});\nsvg.addEventListener('pointerup',function(){drag=null;});\ngd.addEventListener('pointerdown',function(e){if(e.target.id==='oddgrab'){drag='g';gd.setPointerCapture(e.pointerId);sl.value=fromGarden(e);draw();}});\ngd.addEventListener('pointermove',function(e){if(drag==='g'){sl.value=fromGarden(e);draw();}});\ngd.addEventListener('pointerup',function(){drag=null;});\nsl.addEventListener('input',draw);inc.addEventListener('change',draw);\ndocument.querySelectorAll('button[data-v]').forEach(function(b){b.addEventListener('click',function(){setV(+b.dataset.v);});});\ndraw();\n\n<\/script>\n<script>(function(){function s(){parent.postMessage({wh:document.documentElement.scrollHeight,id:\"sun\"},\"*\")}addEventListener(\"load\",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);setInterval(s,700)})()<\/script><\/body>\n<\/html>\n"};
const LAB="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Data accuracy lab<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f6f7f9;--card:#fff;--ink:#14213d;--mut:#55607a;--line:#d6dbe6;--acc:#0f766e;--accbg:#ddf3ef;--bad:#b4350a;--badbg:#fde8df;--ok:#15803d;--okbg:#dff3e5;--bar:#2f5d9e;--bar2:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10151f;--card:#1a2130;--ink:#e8ecf5;--mut:#a3adc2;--line:#2f3a52;--acc:#4fd1c1;--accbg:#12342f;--bad:#ff9a73;--badbg:#3a1f14;--ok:#6fdc8c;--okbg:#15321e;--bar:#6c9be0;--bar2:#ff9a73}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#10151f;--card:#1a2130;--ink:#e8ecf5;--mut:#a3adc2;--line:#2f3a52;--acc:#4fd1c1;--accbg:#12342f;--bad:#ff9a73;--badbg:#3a1f14;--ok:#6fdc8c;--okbg:#15321e;--bar:#6c9be0;--bar2:#ff9a73}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:20px 16px 48px}\nh1{font-size:1.7rem;margin:.2em 0 .1em;line-height:1.2}\nh2{font-size:1.25rem;margin:0 0 .3em}\n.sub{color:var(--mut);margin:0 0 16px}\n[role=tablist]{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n[role=tab]{font:inherit;font-weight:700;padding:9px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}\n[role=tab][aria-selected=true]{border-color:var(--acc);background:var(--accbg)}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}\n.panel[hidden]{display:none}\n.story{background:var(--bg);border-left:4px solid var(--acc);padding:10px 14px;border-radius:4px;margin:0 0 14px}\n.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\ninput[type=range]{flex:1;min-width:160px;accent-color:var(--acc);height:32px}\nbutton.b{font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;border:2px solid var(--acc);background:var(--card);color:var(--ink);cursor:pointer}\nbutton.b:hover{background:var(--accbg)}\n.chartwrap{overflow-x:auto}\nsvg{width:100%;height:auto;max-width:560px;display:block;margin:6px auto}\nsvg text{fill:var(--ink);font-family:inherit}\n.out{padding:10px 14px;border-radius:8px;margin-top:10px;font-weight:700}\n.out.bad{background:var(--badbg);color:var(--bad)}\n.out.ok{background:var(--okbg);color:var(--ok)}\n.out.mid{background:var(--accbg);color:var(--ink)}\n.think{color:var(--mut);margin:10px 0 0}\n.tbl{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:520px}\nth,td{border:1px solid var(--line);padding:0;text-align:left}\nth{padding:8px 10px;background:var(--bg);font-size:.9rem}\ntd button{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 10px;cursor:pointer;min-height:40px}\ntd button:hover{background:var(--accbg)}\ntd button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}\ntd button[aria-pressed=true]{background:var(--accbg);box-shadow:inset 0 0 0 2px var(--acc)}\ntd button.hit{background:var(--okbg);color:var(--ok);font-weight:700}\ntd button.miss{background:var(--badbg);color:var(--bad);font-weight:700}\n.fb{margin:10px 0 0;padding-left:20px}\n.fb li{margin:4px 0}\n.case{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}\n.case h3{margin:0 0 6px;font-size:1.05rem}\n.case ul{margin:0 0 10px;padding-left:20px}\n.case .msg{margin-top:10px;display:none}\n.case .msg.show{display:block}\n.score{font-weight:700;margin-top:6px}\n.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:0 0 16px}.defs div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.95rem}\n.row label{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:36px}\ninput[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}\nselect{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:40px;max-width:100%}\n#p4 .panel{margin-bottom:18px}\n#o-tbl{min-width:360px}#o-tbl th,#o-tbl td{padding:8px 10px}\ntd i{color:var(--mut)}\n.oc{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}\n.oc h3{font-size:1.05rem;margin:0 0 6px}\n.opt{margin:6px 0}.opt label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.opt input{margin-top:3px;flex:none}\n.why{margin:2px 0 4px 30px;font-size:.95rem;font-weight:700}\n.why.ok{color:var(--ok)}.why.bad{color:var(--bad)}.why.mid{color:var(--mut)}\n.omsg{margin-top:8px;font-weight:700}.omsg.ok{color:var(--ok)}.omsg.bad{color:var(--bad)}\n.stp{font-size:1.05rem;margin:20px 0 6px}\n.gi{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:0 0 10px}\n.gi .q{flex:1 1 260px}\n.gi .msg2{width:100%;font-weight:700;font-size:.95rem}\n.msg2.ok{color:var(--ok)}.msg2.bad{color:var(--bad)}\n.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}\n.tc{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}\n.tc.stale{border-color:var(--bad)}\n.tc b{display:block;line-height:1.3}\n.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 6px}\n.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}\n.tc.old .bar i{background:#c58a00}.tc.stale .bar i{background:var(--bad)}\n.st{font-weight:700;font-size:.95rem}\n.tc.stale .st{color:var(--bad)}.tc.old .st{color:var(--ink)}.tc .st{color:var(--ok)}\n@media (prefers-reduced-motion:reduce){.bar i{transition:none}}\n.post{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin:6px 0 10px}\n.ph{display:flex;gap:10px;align-items:center;margin-bottom:6px}\n.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--card);display:grid;place-items:center;font-weight:700;flex:none}\n.hd small{color:var(--mut)}\nbutton.b[aria-pressed=true]{background:var(--accbg)}\n.ev{list-style:none;padding:0;margin:10px 0}\n.ev li{padding:8px 10px;border-radius:8px;margin:0 0 6px;border-left:4px solid var(--line)}\n.ev li.sup{background:var(--okbg);border-color:var(--ok)}\n.ev li.dbt{background:var(--badbg);border-color:var(--bad)}\n.ev li.miss{background:var(--bg);border-color:var(--mut)}\n.ev em{font-style:normal;font-weight:700;font-size:.9rem}\n.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;word-break:break-all;background:var(--bg);padding:8px 10px;border-radius:8px;flex:1 1 280px}\n.url mark{background:var(--accbg);color:var(--ink);font-weight:700;padding:0 2px;border-radius:3px;box-shadow:inset 0 -2px 0 var(--acc)}\n.vsec{border-top:1px solid var(--line);margin-top:18px;padding-top:6px}\n.vh{font-size:1.05rem;margin:12px 0 6px}\ninput[type=text],input[type=number]{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:40px;max-width:100%}\ninput[type=number]{width:90px}\n.fld{margin:0 0 10px}.fld label{display:block;font-weight:700;margin-bottom:2px}.fld input{width:100%;max-width:320px}\n.res{font-size:.95rem;font-weight:700;min-height:1.4em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}\n#v-tbl{min-width:380px}#v-tbl th,#v-tbl td{padding:8px 10px}#v-tbl td.ok{color:var(--ok);font-weight:700}#v-tbl td.bad{color:var(--bad);font-weight:700}\n.vitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.vitem .q{flex:1 1 260px}\n.vmsg{font-weight:700;width:100%}.vmsg.ok{color:var(--ok)}.vmsg.bad{color:var(--bad)}\nbutton.b.go{background:var(--accbg)}\n.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}\nol.steps{margin:0 0 12px;padding-left:22px}ol.steps li{margin:2px 0}\n.ckbox{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg)}\n.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:0 0 8px}\n.ck input{margin-top:3px;flex:none}.ck small{color:var(--mut);font-size:.9rem}\n.where{color:var(--mut)}\n.ev li.neu{background:#e3effb;border-color:#5b8fd1}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .ev li.neu{background:#1b2c44;border-color:#6c9be0}}\n:root[data-theme=\"dark\"] .ev li.neu{background:#1b2c44;border-color:#6c9be0}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Data accuracy lab<\/h1>\n<p class=\"sub\">When you acquire data, judge it on three things before you use it.<\/p>\n<div class=\"defs\"><div><b>Authenticity<\/b><br>Is it genuine, and from who it says?<\/div><div><b>Accuracy<\/b><br>Is it correct, and shown fairly?<\/div><div><b>Timeliness<\/b><br>Is it recent enough for what you need?<\/div><\/div>\n\n<div role=\"tablist\" aria-label=\"Activities\">\n<button role=\"tab\" id=\"t2\" aria-selected=\"true\" aria-controls=\"p2\">Authenticity<\/button>\n<button role=\"tab\" id=\"t1\" aria-selected=\"false\" aria-controls=\"p1\">Accuracy: errors<\/button>\n<button role=\"tab\" id=\"t0\" aria-selected=\"false\" aria-controls=\"p0\">Accuracy: graphs<\/button>\n<button role=\"tab\" id=\"t4\" aria-selected=\"false\" aria-controls=\"p4\">Accuracy: outliers<\/button>\n<button role=\"tab\" id=\"t3\" aria-selected=\"false\" aria-controls=\"p3\">Timeliness<\/button>\n<\/div>\n\n<section class=\"panel\" id=\"p0\" role=\"tabpanel\" aria-labelledby=\"t0\">\n<h2>Same data, different story<\/h2>\n<p class=\"story\">The school library says: \u201cLibrary users went from 100 students last term to 110 this term.\u201d Both numbers are correct. Now drag the slider to move where the graph\u2019s vertical axis starts.<\/p>\n<div class=\"row\"><label for=\"base\"><b>Axis starts at:<\/b> <span id=\"bv\">0<\/span><\/label>\n<input id=\"base\" type=\"range\" min=\"0\" max=\"95\" step=\"5\" value=\"0\">\n<button class=\"b\" id=\"reset\" type=\"button\">Reset to 0<\/button><\/div>\n<div class=\"chartwrap\"><svg id=\"chart\" viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"Bar chart of library users, last term 100 and this term 110\"><\/svg><\/div>\n<div class=\"out mid\" id=\"g-out\" role=\"status\"><\/div>\n<p class=\"think\" id=\"g-think\"><\/p>\n<\/section>\n\n<section class=\"panel\" id=\"p1\" role=\"tabpanel\" aria-labelledby=\"t1\" hidden>\n<div class=\"seg\" role=\"group\" aria-label=\"Choose an activity\"><button class=\"b\" id=\"e-b1\" type=\"button\" aria-pressed=\"true\">Spot the errors<\/button><button class=\"b\" id=\"e-b2\" type=\"button\" aria-pressed=\"false\">Extra: Validation lab<\/button><\/div>\n<div id=\"e-main\">\n<h2>Garbage in, garbage out<\/h2>\n<p class=\"story\">This is a school sign-up table. Someone typed the data in by hand, and 4 entries have mistakes. Tap every cell you think is wrong, then press Check.<\/p>\n<div class=\"tbl\"><table id=\"tbl\"><thead><tr><th>Name<\/th><th>Age<\/th><th>Email<\/th><th>Year level<\/th><th>Joined<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<div class=\"row\" style=\"margin-top:12px\"><button class=\"b\" id=\"chk\" type=\"button\">Check my answers<\/button><button class=\"b\" id=\"rst\" type=\"button\">Start again<\/button><\/div>\n<div class=\"out mid\" id=\"e-out\" role=\"status\" hidden><\/div>\n<ol class=\"fb\" id=\"e-fb\"><\/ol>\n<div class=\"row\"><button class=\"b go\" id=\"e-go\" type=\"button\">Finished? Try the extra: Validation lab<\/button><\/div><\/div>\n<div id=\"e-extra\" hidden>\n<h2>Extra: Validation lab<\/h2>\n<p class=\"story\">Mistakes like these can be caught when the data is typed in. Validation checks that data is sensible at the moment it is entered. Try it, then build it.<\/p>\n<div class=\"vsec\">\n<h4 class=\"vh\">1. Try to break the form<\/h4>\n<p class=\"story\"><b>Validation<\/b> means the computer checks data as it is typed in and refuses anything that doesn\u2019t make sense. First see what happens with no checking, then switch the checks on.<\/p>\n<ol class=\"steps\">\n<li>Press \u201cLoad sample bad data\u201d.<\/li>\n<li>Press \u201cSave record\u201d with all the checks off. Does anything stop the bad data?<\/li>\n<li>Switch the checks on and save again. See which check catches which mistake.<\/li>\n<\/ol>\n<div class=\"row\">\n<button class=\"b go\" id=\"v-bad\" type=\"button\">Load sample bad data<\/button>\n<button class=\"b\" id=\"v-good\" type=\"button\">Load good data<\/button>\n<button class=\"b\" id=\"v-clr\" type=\"button\">Clear form<\/button>\n<\/div>\n<div id=\"v-form\"><\/div>\n<div class=\"ckbox\">\n<div class=\"row\"><b>The checks<\/b>\n<button class=\"b\" id=\"v-allon\" type=\"button\">Switch all on<\/button>\n<button class=\"b\" id=\"v-alloff\" type=\"button\">Switch all off<\/button><\/div>\n<div id=\"v-rules\" role=\"group\" aria-label=\"Validation checks\"><\/div>\n<\/div>\n<div class=\"row\"><button class=\"b go\" id=\"v-save\" type=\"button\">Save record<\/button><\/div>\n<div class=\"out mid\" id=\"v-banner\" role=\"status\" hidden><\/div>\n<\/div>\n<div class=\"vsec\">\n<h4 class=\"vh\">2. Set the rule<\/h4>\n<p class=\"story\">A range check refuses numbers outside limits you choose. The school only has Year 7 to Year 12 students. Set the smallest and largest year level it should accept so every test comes out right.<\/p>\n<div class=\"row\">\n<label for=\"v-mn\">Smallest allowed<\/label><input type=\"number\" id=\"v-mn\" value=\"1\" min=\"0\" max=\"30\">\n<label for=\"v-mx\">Largest allowed<\/label><input type=\"number\" id=\"v-mx\" value=\"20\" min=\"0\" max=\"30\">\n<\/div>\n<div class=\"tbl\"><table id=\"v-tbl\"><thead><tr><th>Test entry<\/th><th>Rule says<\/th><th>It should be<\/th><th>Match?<\/th><\/tr><\/thead><tbody id=\"v-tests\"><\/tbody><\/table><\/div>\n<div class=\"out mid\" id=\"v-tout\" role=\"status\"><\/div>\n<\/div>\n\n<div class=\"vsec\">\n<h4 class=\"vh\">3. Match the check<\/h4>\n<p class=\"story\">Each mistake is caught by a different kind of check. Choose the one that would catch it. The checks in Part 1 explain what each one does.<\/p>\n<div id=\"v-match\"><\/div>\n<div class=\"row\"><button class=\"b go\" id=\"v-mchk\" type=\"button\">Check my answers<\/button><\/div>\n<div class=\"out mid\" id=\"v-mscore\" role=\"status\" hidden><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"panel\" id=\"p2\" role=\"tabpanel\" aria-labelledby=\"t2\">\n<h2>Is it the real thing?<\/h2>\n<p class=\"story\">Authentic data comes from who it says it does, and can be traced back to its origin. Don\u2019t go by how it looks or how many people shared it. Go looking for evidence.<\/p>\n\n<h3 class=\"stp\">Step 1: Investigate the post<\/h3>\n<p class=\"story\"><b>The situation:<\/b> you are researching school life for a class project. These three posts turned up on social media this week. Before you use any of them, you need to decide whether you can trust them. The accounts and posts are made up for this activity.<\/p>\n<p>Click the checks to collect evidence, then give your verdict. You need at least two clues first. Tip: real fact-checkers open a second tab and search for the claim.<\/p>\n<div id=\"a-post\"><\/div>\n\n<h3 class=\"stp\">Step 2: Real or lookalike address?<\/h3>\n<p class=\"story\">Find the first single / in the address. Read backwards from there: the last name before it, with its ending (like .com or .gov), is who owns the website. Anything in front of that is just a label the owner chose.<\/p>\n<div id=\"a-url\"><\/div>\n<div class=\"score\" id=\"a-us\" role=\"status\"><\/div>\n\n<h3 class=\"stp\">Step 3: Your call<\/h3>\n<div id=\"c-auth\"><\/div>\n<div class=\"score\" id=\"sc\" role=\"status\"><\/div>\n<h3 class=\"stp\">Step 4: Your fact-check toolkit<\/h3>\n<p>Keep these questions handy whenever you find data online. Tick each one as you use it.<\/p>\n<div class=\"ckbox\" id=\"a-kit\"><\/div>\n<div class=\"score\" id=\"a-ks\" role=\"status\"><\/div>\n<p class=\"where\">Fact-checking sites such as Snopes can also help with viral posts and memes.<\/p>\n<\/section>\n\n<div id=\"p4\" role=\"tabpanel\" aria-labelledby=\"t4\" hidden>\n<section class=\"panel\">\n<h2>Part 1: What is an outlier?<\/h2>\n<p class=\"story\">An outlier is a value that is far away from the rest. It might be a mistake, or a real result that is just unusual. Either way, investigate it. Don\u2019t ignore it, and don\u2019t delete it without checking.<\/p>\n<p>These are daily screen times in minutes. Five students gave typical answers. Tick or untick the two odd values and watch the average.<\/p>\n<div class=\"row\">\n<label><input type=\"checkbox\" id=\"o-c1\" checked> Include 999<\/label>\n<label><input type=\"checkbox\" id=\"o-c2\" checked> Include -30<\/label>\n<\/div>\n<svg id=\"o-chart\" viewBox=\"0 0 560 130\" role=\"img\" aria-label=\"Number line of screen time values with the average marked\"><\/svg>\n<div class=\"out mid\" id=\"o-avg\" role=\"status\"><\/div>\n<\/section>\n\n<section class=\"panel\">\n<h2>Part 2: Data detective<\/h2>\n<p class=\"story\">A class collected this data about daily screen time. Study it, then answer the five questions.<\/p>\n<div class=\"tbl\"><table id=\"o-tbl\"><thead><tr><th>Student<\/th><th>Age<\/th><th>Daily screen time (minutes)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<div id=\"o-qs\"><\/div>\n<div class=\"row\"><button class=\"b\" id=\"o-chk\" type=\"button\">Check my answers<\/button><button class=\"b\" id=\"o-rst\" type=\"button\">Start again<\/button><\/div>\n<div class=\"out mid\" id=\"o-score\" role=\"status\" hidden><\/div>\n<\/section>\n<\/div>\n\n<section class=\"panel\" id=\"p3\" role=\"tabpanel\" aria-labelledby=\"t3\" hidden>\n<h2>Data has a sell-by date<\/h2>\n<p class=\"story\">Timely data is recent enough for what you want to do with it. Some data spoils in minutes. Some never does.<\/p>\n\n<h3 class=\"stp\">Step 1: Guess the shelf life<\/h3>\n<p>How long until each piece of data is out of date? Choose, then reveal.<\/p>\n<div id=\"t-guess\"><\/div>\n<div class=\"row\"><button class=\"b go\" id=\"t-rev\" type=\"button\">Reveal shelf lives<\/button><\/div>\n<div class=\"out mid\" id=\"t-gs\" role=\"status\" hidden><\/div>\n\n<h3 class=\"stp\">Step 2: Travel through time<\/h3>\n<p>Drag the slider to see how old your data is. Watch what spoils first.<\/p>\n<div class=\"row\"><label for=\"t-age\"><b>Data was collected:<\/b> <span id=\"t-lbl\">just now<\/span><\/label>\n<input id=\"t-age\" type=\"range\" min=\"0\" max=\"9\" step=\"1\" value=\"0\"><\/div>\n<div class=\"tm\" id=\"t-cards\"><\/div>\n\n<h3 class=\"stp\">Step 3: Your call<\/h3>\n<div id=\"c-time\"><\/div>\n<div class=\"score\" id=\"sc2\" role=\"status\"><\/div>\n<\/section>\n<\/main>\n\n<script>\n(function(){\nvar tabs=[].slice.call(document.querySelectorAll('[role=tab]')),n=tabs.length;\nfunction show(i){tabs.forEach(function(t,j){t.setAttribute('aria-selected',j===i);t.tabIndex=j===i?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=j!==i})}\ntabs.forEach(function(t,i){t.onclick=function(){show(i)};t.onkeydown=function(e){var k=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?n-1:0;if(k){var m=(i+k)%n;show(m);tabs[m].focus()}}});\nshow(0);\n\n/* 1. Misleading graph */\nvar base=document.getElementById('base'),svg=document.getElementById('chart'),NS='http://www.w3.org/2000/svg';\nfunction draw(){\nvar b=+base.value,top=120,H=220,y0=250;\ndocument.getElementById('bv').textContent=b;\nvar sc=function(v){return (v-b)/(top-b)*H};\nvar h1=sc(100),h2=sc(110),s='';\nfor(var v=b;v<=top;v+=(top-b)>60?20:5){var y=y0-sc(v);s+='<line x1=\"60\" x2=\"540\" y1=\"'+y+'\" y2=\"'+y+'\" stroke=\"va  const r=RS.rows.find(x=>x.student_id===id);if(!r||RS.busy||!supabaseClient)return;
 RS.busy=true;RS.pend="";
 try{const {data,error}=await supabaseClient.rpc("claim_student_name",{p_access_token:ACCESS_TOKEN,p_student_id:id});
  if(error)throw error;
  if(data==="ok"){r.taken=true;r.mine=true;applyMine();RS.msg="";Object.keys(pendingResponses).forEach(k=>flushResponse(k))}
  else{await loadRoster();RS.msg=data==="taken"?"Someone else has already chosen that name. If it really is you, tell your teacher.":data==="already_chosen"?"You have already chosen a name in this lesson.":"That didn’t work. Tell your teacher."}}

async function startDatabase(){
 try{
  if(!ACCESS_TOKEN){dbStatus("No lesson link, so WE DO answers are not being sent. Open the link your teacher gave you.");return}
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session:oldSession}}=await supabaseClient.auth.getSession();
  // Reuse this device's existing anonymous sign-in; signing in again on every load orphaned the student's chosen name.
  let authError=null;if(!oldSession||!oldSession.user||!oldSession.user.is_anonymous){authError=(await supabaseClient.auth.signInAnonymously()).error}
  if(authError)throw new Error("Student sign-in failed: "+authError.message);
  // Has the teacher deleted this lesson? If so, close WE DO (YOU DO and I DO are untouched).
  const {data:lessonState,error:stateError}=await supabaseClient.rpc("get_lesson_status",{p_access_token:ACCESS_TOKEN});
  if(!stateError){
   const gone=lessonState==="deleted";
   if(gone!==!!S.weClosed){S.weClosed=gone;save();render()}
   if(gone){dbStatus("WE DO is closed because this lesson was removed by your teacher. Your YOU DO work is still here.");return}
  }
  await loadRoster();render();
  const {data,error}=await supabaseClient.rpc("get_lesson_questions",{p_access_token:ACCESS_TOKEN});
  if(error)throw new Error("Lesson question retrieval failed: "+error.message);
  if(!data||!data.length)throw new Error("No questions were returned for this lesson.");
  dbQuestionIds={};
  data.forEach(row=>{if(row.question_code&&row.question_id)dbQuestionIds[CODE_MAP[row.question_code]||row.question_code]=row.question_id});
  const expected=Q.filter(q=>q.st==="t").length;
  const matched=Q.filter(q=>q.st==="t"&&dbQuestionIds[q.id]).length;
  if(matched!==expected)dbStatus("Connected, but "+matched+" of "+expected+" WE DO questions are linked. Please check lesson setup.");
  else dbStatus("Connected · WE DO responses enabled");
  Object.keys(pendingResponses).forEach(id=>flushResponse(id));
 }catch(error){dbStatus("Response collection unavailable: "+error.message)}
 finally{if(RS.mode==="loading"){RS.mode="typed";render()}}
}

function d1(){return `<div class="big">🧭 <b>Data quality</b> means data is suitable, reliable and useful for the purpose it is being used for. There are three big questions to ask:</div>${tb(["Concept","Question to ask","What it means"],[["<b>Authenticity</b>","Is it genuine?","Data is genuine and comes from a trustworthy source. It hasn’t been faked, altered or misrepresented."],["<b>Accuracy</b>","Is it correct?","Data is correct and reflects the real-world information it is supposed to represent."],["<b>Timeliness</b>","Is it current enough?","Data is current and available when it is needed."]])}
<h2>Authenticity: real or fake?</h2><div class="lo"><b>VOCABULARY</b> · authenticity: whether data is genuine and comes from a trustworthy source. It has not been faked, altered or misrepresented.</div>
${stp("fa",["Start by looking at the image. It looks like a real photo of a woman. But looking good isn’t the same as being <b>authentic</b>. We need to check.","Look for small details. Zoom in on the skin and the hair. Real skin has tiny flaws, and real hair has stray strands.","Here, the skin looks <b>glossy</b> and the hair looks <b>perfect</b>. That’s a warning sign for an AI-generated image.","Now check the source. Search for the event it was supposedly taken at. Are there other posts or stories about it? Here there are none we can trust.","Verdict: glossy skin, perfect hair and no trustworthy source. This image is probably <b>FAKE</b> (AI-generated)."],vA,"👀 Watch me check whether an image is real. Press <b>Next step</b>.")}
<div style="height:14px"></div>${stp("fh",["Let’s check a second image. It seems to show two people walking along a street, holding hands.","Check the hands. AI often struggles to create hands, especially when they are touching something else.","Here the hands look <b>wrong</b>: they don’t look natural where they touch. That’s a sign this image was created by AI.","Verdict: odd hands and no trustworthy source. This image is <b>FAKE</b>. A good check for a real image is to search for the event and find other posts or stories about it."],vB,"👀 Let me check another image.")}
<div class="cfu"><b>💬 THINK, PAIR, SHARE</b> · A good way to check if an image is real is to search for the event it shows and look for other posts or stories. Can you outline another way?</div>
<h2>Deepfakes and plausible deniability</h2><div class="qg"><div><p>Traditionally, a video of an event could be used as evidence of what happened. But now:</p><ul><li>Videos can be manipulated or entirely AI-generated.</li><li>Voices can be cloned.</li><li>Screenshots and messages can be fabricated.</li><li>Genuine recordings can be claimed to be fake.</li></ul><p>Some deepfakes are made for entertainment, but others impersonate celebrities or leaders to spread misinformation.</p></div><div><img class="qi" style="max-height:none" src="${IMG.c21}" alt="Comic: one person denies a crime, another fakes a video with AI"></div></div>
<div class="lo"><b>VOCABULARY</b> · plausible deniability: someone can deny responsibility or involvement because there is reasonable doubt about what actually happened, when the evidence can’t be trusted.</div>
<div class="cfu"><b>💬 SCENARIO</b> · A student is recorded making an offensive comment and the video is shared around the school. The student says: “That’s not me. It’s an AI deepfake.” Can the school confidently establish what happened? What would you need to investigate? Does simply claiming something is a deepfake make it plausible?<br><b>Questions to ask:</b> Is this genuine? Has it been manipulated, fabricated or taken out of context?</div>
<h2>Impersonation</h2><div class="qg"><div><p>Long before AI, people were impersonating others online. Impersonation can be used to:</p><ul><li>Steal personal information or money.</li><li>Damage someone’s reputation.</li><li>Spread false information.</li><li>Gain access to accounts or services.</li></ul><p><b>It can have serious consequences and may result in criminal charges.</b></p><div class="cfu"><b>💬 WRITE</b> · 3 examples of impersonation online.</div></div><div><img class="qi" style="max-height:none" src="${IMG.imp18}" alt="Impersonation infographic"></div></div>`}
function d2(){return `<h2>Accuracy: is it correct?</h2><div class="qg"><div><p><b>Accuracy</b> means how close your data or measurements are to the true or real value.</p><p><b>The bullseye analogy:</b> imagine throwing darts. The bullseye is the true, correct answer. Accuracy is how close your dart lands. A dart in the centre is accurate. A dart on the outer edge or off the board is inaccurate.</p><div class="lo"><b>VOCABULARY</b> · accuracy: how close a piece of data is to the true, real-world fact it is supposed to describe.</div></div><div class="ctr"><img class="qi" src="${IMG.d22}" alt="Dartboard"></div></div>
<h2>Spot the errors: the canteen</h2>${stp("can",["Here is the canteen’s sales data. Rule to remember: <b>price × units sold = total sales</b>. Check a row we trust: Egg sandwich: 6.00 × 24 = 144.00 ✔","<b>Impossible values.</b> Vegemite sandwich sold −3. You can’t sell −3 sandwiches! The units should be 3, so the total is 16.50.","<b>Wrong calculations.</b> Cheese toastie: 5.00 × 12 = 60.00, but the total says 50.00. ✘","<b>Unusual values (outliers).</b> Bottled water sold 350, but the canteen usually sells 20 to 40. Maybe 35 was typed as 350. 2.00 × 35 = 70.00. We would check before changing it.","<b>Missing values.</b> The muffin’s total is blank. We can work it out: 3.00 × 15 = 45.00.","<b>Wrong calculations again.</b> Banana: 1.00 × 28 = 28.00, not 280.00. An extra 0 sneaked in.","<b>Unusual values.</b> Chicken salad costs 80.00? Other items cost $1 to $8. The total is 88.00 and 88.00 ÷ 11 units = 8.00, so the price should be 8.00.","<b>Summary:</b> we found 6 errors. Look out for wrong calculations, incorrect or impossible values, unusual values that don’t make sense, and missing values."],vC,"👀 Watch me find every error in this data. Press <b>Next step</b>.")}
<h2>Outliers</h2><div class="qg"><div><p>An <b>outlier</b> is a data point that is noticeably different from the rest, the odd one out, like a billionaire sitting in a room full of office workers. Outliers can cause:</p><ul><li><b>Misleading averages:</b> they make averages much higher or lower than normal.</li><li><b>Poor decisions:</b> people act on unusual values.</li><li><b>Incorrect conclusions:</b> the wrong story gets told.</li></ul><div class="lo"><b>VOCABULARY</b> · outlier: a data point that is much higher or much lower than the rest of the numbers in a set.</div></div><div class="ctr"><img class="qi" src="${IMG.dot19}" alt="Dot plot with one outlier"></div></div>
<div class="big"><b>Are outliers always errors?</b> The canteen usually sells 20 to 40 bottles of water at lunchtime, but the data says 350. Is that unusual? Is it necessarily wrong? It could be a typing error (35 entered as 350), so we investigate before correcting. An outlier may indicate an error, but it isn’t automatically inaccurate.</div>
<div class="qg"><div class="card"><b>Outlier or not?</b> Students record their daily gaming time (hours): A 2, B 3, C 1, D 4, E <b>250</b>. Is 250 hours per day possible? Could someone have entered the wrong number? Should we check the value before using it?</div><div class="ctr"><img class="qi" style="max-height:170px" src="${IMG.gamer13}" alt="Student gaming"></div></div>

<h2>Missing and biased data</h2><div class="qg"><div class="card"><b>Missing data.</b> Students collect rainfall. ${tb(["Student","Rainfall (mm)","Data status"],[["Alex","12","Recorded"],["Mia","0","Recorded: no rain"],["Jack","—","Missing"],["Sophie","8","Recorded"],["Noah","15","Recorded"],["Ella","—","Missing"]])}<p>We cannot assume a blank means zero. Data should be checked before it is used.</p></div><div class="card"><b>Biased data</b> unfairly favours one group, opinion or outcome. A school surveys 100 students, but only those buying hamburgers: 85% prefer hamburgers, 10% sandwiches, 5% salads.<div class="ctr"><img class="qi" style="max-height:120px" src="${IMG.burger5}" alt="Burger meal"></div><p>The results may not represent the whole school. Biased data gives misleading results, leaves some groups out, and leads to poor decisions.</p></div></div>
<div class="cfu"><b>💬 THINK, PAIR, SHARE</b> · How could the missing values affect the usefulness of the data? How would you collect <b>unbiased</b> data for the canteen survey?</div>`}
function d3(){return `<h2>Timeliness: is it current enough?</h2><div class="qg"><div><p><b>Timeliness</b> means data is up to date and available when it is needed. Think of data like food:</p><ul><li><b>Fresh food</b> is safe and suitable to eat.</li><li><b>Stale food</b> has been sitting around too long and may no longer be suitable.</li></ul><p>Data goes stale too. Information that was correct yesterday may not be correct today.</p><div class="lo"><b>VOCABULARY</b> · timeliness: how quickly information becomes available and how up to date it is relative to when the real-world event happened.</div></div><div class="ctr"><img class="qi" src="${IMG.toast9}" alt="Stale toast"></div></div>
<div class="qg"><div class="card"><b>Examples</b><ul><li><b>Weather:</b> yesterday’s forecast isn’t useful for deciding what to wear today.</li><li><b>Bus timetables:</b> an outdated timetable shows incorrect times.</li><li><b>Student information:</b> an old address may no longer be correct.</li></ul></div><div class="card"><b>Why timeliness matters</b><ul><li><b>Outdated decisions</b> from old information.</li><li><b>Missed opportunities</b> when information arrives too late.</li><li><b>Incorrect information</b> that no longer matches the situation.</li></ul></div></div>
<div class="big">🚌 <b>Make the connection:</b> if the Transperth app wasn’t kept up to date, you might miss your bus. Even accurate data becomes less useful as it gets older.</div>
<h2>How far behind can the app be?</h2>${stp("bus",["The bus drives <b>10 metres every second</b>.","The bus only <b>reports its location every 60 seconds</b>. Between reports the app has no new information.","Worst case: the bus drives for almost the whole 60 seconds before the next report arrives.","<b>Distance = speed × time</b> = 10 × 60 = 600 m.","So the app’s dot can be up to <b>600 m behind</b> the real bus. You will test this with the bus widget in WE DO."],vD,"👀 Watch me work out how out of date the app can be.")}

<div class="cfu"><b>💬 THINK, PAIR, SHARE</b> · Why does data go stale? Give another example of outdated data.</div>
<div class="big"><b>Key takeaway:</b> just like food, data has a useful life.</div>`}
