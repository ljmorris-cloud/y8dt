<script id="logic">
const PV=[128,64,32,16,8,4,2,1];
const b2d=s=>parseInt(s,2),d2b=n=>n.toString(2).padStart(8,"0"),pw=k=>2**k;
const Q=[],Qm={},add=o=>{Q.push(o);Qm[o.id]=o};
const dbl=b=>Array(b).fill(2).join(" × ");
const pat=(id,st,b,x)=>add({id,sk:1,st,k:"n",p:`With <b>${b} bits</b>, how many different patterns can you make? ${x||""}`,a:pw(b),
 h:v=>Number(v)==b*2?`That’s ${b} × 2. Each extra bit <i>doubles</i> the count, so multiply 2 by itself once for every bit.`:Number(v)==b*b?"Not squared. Start with 2 patterns for 1 bit, then double for each extra bit.":`Start with 2 patterns for 1 bit, then double for each extra bit: ${dbl(b)}.`,e:`${dbl(b)} = ${pw(b)}.`});
// Skill 1
add({id:"1c",sk:1,st:"c",k:"mc",p:"Which sentence is correct?",o:["A byte is a group of 8 bits","A bit is a group of 8 bytes","A byte is a single 0 or 1","A bit and a byte are the same thing"],a:0,h:"A bit is just one 0 or 1. A byte is the bigger group made from several bits.",e:"A bit is one 0 or 1, and a byte is 8 bits together."});
add({id:"1t1",sk:1,st:"t",k:"mc",p:"How many bits make <b>one byte</b>?",o:[4,8,16,10],a:1,h:"Look back at the Watch step: a byte is a group of bits, and the group has a fixed size.",e:"1 byte = 8 bits."});
pat("1t2","t",2,"(They are 00, 01, 10, 11.)");pat("1t3","t",3);
add({id:"1t4",sk:1,st:"t",k:"n",p:"A byte has 8 bits, so it’s 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2. How many patterns is that?",a:pw(8),h:"Keep doubling: 2, 4, 8, 16, 32, 64, 128, … one doubling for each of the 8 bits.",e:"Eight 2s multiplied together make 256."});
add({id:"1t5",sk:1,st:"t",k:"n",p:"Patterns start counting at <b>0</b>. What is the <b>largest number</b> one byte can show?",a:pw(8)-1,h:v=>Number(v)==256?"256 is how many patterns there are, but counting starts at 0, so the biggest number is one less.":"There are 256 patterns and the first one is 0. The last one is 256 − 1.",e:"0 is a pattern too, so 256 patterns run from 0 to 255."});
add({id:"1s1",sk:1,st:"s",k:"mc",p:"What is a <b>bit</b>?",o:["A single 0 or 1","A group of 8 digits","A colour","A type of file"],a:0});
pat("1s2","s",4);pat("1s3","s",5);
add({id:"1s4",sk:1,st:"s",k:"n",p:"How many <b>bytes</b> are in 24 bits?",a:24/8});
add({id:"1s5",sk:1,st:"s",k:"n",p:"What is the <b>smallest</b> number one byte can show?",a:b2d("00000000")});
add({id:"1s6",sk:1,st:"s",k:"n",p:"One pixel stores 3 bytes (red, green and blue). How many <b>bits</b> is that?",a:3*8});
add({id:"1s7",sk:1,st:"s",k:"n",p:"One colour channel is 1 byte. How many <b>different values</b> can it show?",a:pw(8)});
// Skill 2
add({id:"2c",sk:2,st:"c",k:"n",p:"What is the place value of the <b>4th bit from the right</b>?",a:PV[PV.length-4],h:"From the right the place values go 1, 2, 4 … keep doubling until you reach the 4th one.",e:"1, 2, 4, 8: the 4th from the right is 8."});
["00001011","10000001","01100100"].forEach((s,i)=>add({id:"2t"+(i+1),sk:2,st:"t",k:"b2d",bits:s,p:`Convert <b>${s}</b> to decimal, one bit at a time.`,a:b2d(s)}));
["00000101","00110011","10000000","11000000","01010101","11111111"].forEach((s,i)=>add({id:"2s"+(i+1),sk:2,st:"s",k:"n",p:`Convert <b>${s}</b> to decimal.`,a:b2d(s)}));
add({id:"2s7",sk:2,st:"s",k:"mc",p:"Which binary number is <b>bigger</b>?",o:["01111111","10000000"],a:b2d("01111111")>b2d("10000000")?0:1});
// Skill 3
add({id:"3c",sk:3,st:"c",k:"mc",p:"You have <b>100</b> left. Does <b>64</b> fit into 100?",o:["Yes → write 1 and subtract","No → write 0 and keep going"],a:64<=100?0:1,h:"Is 64 smaller than or equal to 100? If so it fits.",e:"64 ≤ 100, so it fits: write 1 and work out 100 − 64."});
[13,100,200].forEach((n,i)=>add({id:"3t"+(i+1),sk:3,st:"t",k:"d2b",n,p:`Write <b>${n}</b> as an 8-bit binary number, one place value at a time.`,a:d2b(n)}));
[5,37,64,129,170,255].forEach((n,i)=>add({id:"3s"+(i+1),sk:3,st:"s",k:"n",bin:1,p:`Write <b>${n}</b> as an 8-bit binary number.`,a:d2b(n)}));
// Skill 4: RGB
const hx=n=>n.toString(16).padStart(2,"0"),hex=(r,g,b)=>hx(r)+hx(g)+hx(b),rg=a=>a.join(",");
add({id:"4c",sk:4,st:"c",k:"mc",p:"In a hex colour like <b>#ff0000</b>, the <b>first two</b> digits control which channel?",o:["Red","Green","Blue"],a:0,h:"Hex is always written in the order R, G, B, so the first pair belongs to the first colour in the name.",e:"Hex is written red, green, blue: #RRGGBB."});
add({id:"4t1",sk:4,st:"t",k:"mc",p:"How many <b>bytes</b> does one pixel use?",o:[1,3,8,24],a:1,h:"Each of the 3 channels (red, green, blue) uses one byte.",e:"3 channels × 1 byte = 3 bytes (24 bits)."});
add({id:"4t2",sk:4,st:"t",k:"mc",p:"What colour is <b>rgb(0, 255, 0)</b>?",o:["Red","Green","Blue","Yellow"],a:1,h:"Only the middle channel is turned up to 255. Which colour sits in the middle of R, G, B?",e:"Green is full on, red and blue are off."});
add({id:"4t3",sk:4,st:"t",k:"n",txt:1,ph:"R,G,B",p:"Type the RGB values for <b>pure blue</b> as R,G,B (for example 1,2,3).",a:rg([0,0,255]),h:"Blue is the LAST channel. Red and green are off (0) and blue is full (255).",e:"Pure blue is rgb(0, 0, 255)."});
add({id:"4t4",sk:4,st:"t",k:"n",txt:1,ph:"R,G,B",p:"<b>Yellow</b> is red light and green light mixed. Type its RGB values as R,G,B.",a:rg([255,255,0]),h:"Turn red and green both fully on (255) and leave blue off (0).",e:"Yellow is rgb(255, 255, 0)."});
add({id:"4t5",sk:4,st:"t",k:"n",txt:1,hex:1,ph:"6 characters",p:"In hex, 255 is <b>ff</b> and 0 is <b>00</b>. What is the hex code for <b>rgb(255, 0, 0)</b>? (6 characters, the # is optional)",a:hex(255,0,0),h:"Write red, green, blue as pairs: red = ff, green = 00, blue = 00.",e:"#ff0000 is red."});
add({id:"4s1",sk:4,st:"s",k:"n",txt:1,ph:"R,G,B",p:"Type the RGB values for <b>white</b> as R,G,B.",a:rg([255,255,255])});
add({id:"4s2",sk:4,st:"s",k:"n",txt:1,ph:"R,G,B",p:"Type the RGB values for <b>black</b> as R,G,B.",a:rg([0,0,0])});
add({id:"4s3",sk:4,st:"s",k:"n",txt:1,hex:1,ph:"6 characters",p:"What is the hex code for <b>pure green</b>?",a:hex(0,255,0)});
add({id:"4s4",sk:4,st:"s",k:"n",txt:1,hex:1,ph:"6 characters",p:"What is the hex code for <b>pure blue</b>?",a:hex(0,0,255)});
add({id:"4s5",sk:4,st:"s",k:"mc",p:"In <b>#3366ff</b>, which two digits are the <b>green</b> channel?",o:["33","66","ff"],a:["33","66","ff"].indexOf("3366ff".slice(2,4))});
add({id:"4s6",sk:4,st:"s",k:"n",p:"How many <b>bits</b> are in one colour channel?",a:8});
add({id:"4s7",sk:4,st:"s",k:"n",txt:1,ph:"R,G,B",p:"Convert the hex colour <b>#ff00ff</b> to RGB values, as R,G,B.",a:rg([parseInt("ff",16),parseInt("00",16),parseInt("ff",16)])});
add({id:"4s8",sk:4,st:"s",k:"n",txt:1,hex:1,ph:"6 characters",p:"What is the hex code for <b>yellow</b>?",a:hex(255,255,0)});
add({id:"1r1",sk:1,st:"t",k:"n",p:"🔁 Binary refresher: convert <b>11111111</b> to decimal.",a:b2d("11111111"),h:"Add every place value, because every bit is 1: 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1.",e:"All eight place values added together make 255, the biggest value a byte can hold."});
add({id:"1r2",sk:1,st:"t",k:"n",p:"🔁 Binary refresher: convert <b>00001011</b> to decimal.",a:b2d("00001011"),h:"Only add the place values that sit under a 1: 8, 2 and 1.",e:"8 + 2 + 1 = 11."});
// follows the slides: bytes -> pixels and RGB -> hex colour codes (binary already taught)
const HX=["4c","4t5","4s3","4s4","4s5","4s7","4s8"];
Qm["4s8"].p="What is the hex code for <b>white</b>?";Qm["4s8"].a=hex(255,255,255);
Q.splice(0,Q.length,...Q.filter(q=>!q.id.startsWith("1r")&&q.sk!=2&&q.sk!=3));

 return `<h1>📄 Hand in</h1><div class="card"><div class="big">Your name: ${nm()}</div><p>📅 ${new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})} &nbsp; ✅ Score: <b>${done()} / ${tot()}</b></p><table><tr><th>Skill</th><th>Correct</th></tr>${sub}</table><p>Anything marked “not yet correct” is still included, so go back and try again if you have time. 💪</p>
<div class="ctr"><button class="btn" onclick="dl()">⬇ Download my Word file</button><button class="btn" onclick="cp()">📋 Copy my answers</button></div><div id="hm" class="fb info" style="display:none"></div><textarea id="ct" style="display:none;margin-top:12px"></textarea></div>${datapanel()}`}
const hm=t=>{$("hm").style.display="block";$("hm").textContent=t};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const when=()=>new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
const NV="102B51";
const run=(t,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}<w:sz w:val="${o.z||21}"/></w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const para=(t,o={})=>`<w:p><w:pPr>${o.keep?"<w:keepNext/>":""}${o.bd?`<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="${o.bd}"/></w:pBdr>`:""}${o.bg?`<w:shd w:val="clear" w:color="auto" w:fill="${o.bg}"/>`:""}<w:spacing w:before="${o.sb==null?60:o.sb}" w:after="${o.sa==null?60:o.sa}"/></w:pPr>${run(t,o)}</w:p>`;
const tc=(t,w,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.bg?`<w:shd w:val="clear" w:color="auto" w:fill="${o.bg}"/>`:""}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:before="50" w:after="50"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:""}</w:pPr>${run(t,o)}</w:p></w:tc>`;
const tbl=(ws,head,rows)=>{const t=ws.reduce((a,x)=>a+x,0),bd=["top","left","bottom","right","insideH","insideV"].map(x=>`<w:${x} w:val="single" w:sz="4" w:space="0" w:color="BFC9D9"/>`).join("");
 return `<w:tbl><w:tblPr><w:tblW w:w="${t}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${head?`<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>${head.map((h,i)=>tc(h,ws[i],{b:1,c:"FFFFFF",bg:"1761AD"})).join("")}</w:tr>`:""}${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.join("")}</w:tr>`).join("")}</w:tbl>`};
async function mk(){const zip=new JSZip(),R=rows(),ws=[600,3800,2100,2238,900],
 rs=r=>r.res=="Correct"?["E2F6E9","146C3B"]:r.res.startsWith("Not yet")?["FFF1CC","7A5200"]:["F1F3F5","555555"];
 let b=para("Data Representation: Pixels, RGB and Grayscale",{b:1,z:40,c:"FFFFFF",bg:NV,sb:0,sa:0})
 +para("Aveley Secondary College · Year 8 Digital Technologies",{z:20,c:"F0B22D",bg:NV,bd:"F0B22D",sb:0,sa:160})
 +tbl([2200,7438],null,[["Name",S.name||"(not entered)"],["Date",when()],["Score",`${done()} / ${tot()} questions correct`],["Colour guessing game",`${S.gw} won (best streak ${S.gs})`]].map(r=>[tc(r[0],2200,{b:1,bg:"E4F0FB"}),tc(r[1],7438)]))
 +para("Summary",{b:1,z:28,c:NV,sb:240,keep:1})
 +tbl([6638,3000],["Skill","Correct"],[1,2,3,4,5].map(k=>[tc(`Skill ${k}: ${SK[k]}`,6638),tc(`${done(k)} / ${tot(k)}`,3000,{jc:"center"})]));
 [1,2,3,4,5].forEach(k=>{b+=para(`Skill ${k}: ${SK[k]}  (${done(k)} / ${tot(k)})`,{b:1,z:26,c:NV,bg:"E4F0FB",sb:280,sa:100,keep:1})
  +tbl(ws,["#","Question","Student answer","Result","Tries"],R.filter(r=>r.sk==k).map(r=>{const [bg,c]=rs(r);return [tc(r.n,ws[0],{jc:"center"}),tc(r.p,ws[1]),tc(r.a,ws[2]),tc(r.res,ws[3],{b:1,c,bg}),tc(String(r.tries),ws[4],{jc:"center"})]}))});
 b+=para("Reflection",{b:1,z:28,c:NV,bd:"F0B22D",sb:320,sa:100,keep:1});
 RP.forEach((p,i)=>{b+=para(`${i+1}. ${p}`,{b:1,c:NV,sb:180,keep:1})+(S.r[i]||"(not answered)").split(/\n+/).map(l=>para(l,{bg:"F1F5F9",sb:20,sa:20})).join("")});
 const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 zip.file("[Content_Types].xml",X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
 zip.file("_rels/.rels",X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
 zip.file("word/_rels/document.xml.rels",X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
 zip.file("word/styles.xml",X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="21"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`);
 zip.file("word/document.xml",X+`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`);
 return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
async function dl(){if(!S.name.trim())return hm("✏️ Please type your name first.");
 const fn=`Data Representation - ${S.name.trim().replace(/[\\/:*?"<>|]/g,"")}.docx`;
 let blob;try{blob=await mk()}catch(e){return hm("Couldn’t build the file. Use “Copy my answers” instead.")}
 if(!DL){try{DL=await window.claude.use("downloads")}catch(e){}}
 if(DL){try{await DL.save({filename:fn,data:blob});return hm("✅ Saved! Hand that file in to your teacher.")}catch(e){if(e&&e.code=="declined")return hm("No worries. Click again when you’re ready.")}}
 try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);hm("✅ Your Word file should be in your Downloads folder. If nothing appeared, use “Copy my answers” instead.")}catch(e){hm("The download didn’t work here. Use “Copy my answers” instead.")}}
async function cp(){if(!S.name.trim())return hm("✏️ Please type your name first.");let t=`Data Representation: Pixels, RGB and Grayscale\nName: ${S.name}\nDate: ${when()}\nScore: ${done()} / ${tot()}\nColour guessing game: ${S.gw} won (best streak ${S.gs})\n\n`+rows().map(r=>`${r.n}. ${r.p}\n   Answer: ${r.a} | ${r.res} | tries: ${r.tries}`).join("\n")+"\n\nReflections:\n"+RP.map((p,i)=>`${p}\n${S.r[i]||"(not answered)"}`).join("\n\n");
 const a=$("ct");a.value=t;a.style.display="block";a.select();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}hm(ok?"📋 Copied! Paste it into a document and hand it in.":"Select all the text in the box, copy it and paste it into a document.")}
function render(){hdr();$("app").innerHTML=S.pg=="w"?welcome():"12345".includes(S.pg)?skill(+S.pg):S.pg=="p"?gridpage():S.pg=="g"?gamev():S.pg=="r"?reflect():handin();if(S.pg=="g")gav()}
render();
startDatabase();
try{window.claude.use("downloads").then(d=>{if(d){DL=d;if(S.pg=="h")render()}}).catch(()=>{})}catch(e){}
</script></body></html>
