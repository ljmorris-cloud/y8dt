<script id="logic">
const PV=[128,64,32,16,8,4,2,1];
const b2d=s=>parseInt(s,2),d2b=n=>n.toString(2).padStart(8,"0"),pw=k=>2**k;
const Q=[],Qm={},add=o=>{Q.push(o);Qm[o.id]=o};
const dbl=b=>Array(b).fill(2).join(" × ");
const pat=(id,st,b,x)=>add({id,sk:1,st,k:"n",p:`With <b>${b} bits</b>, how many different patterns can you make? ${x||""}`,a:pw(b),h:`Start with 2 patterns for 1 bit, then double for each extra bit: ${dbl(b)}.`,e:`${dbl(b)} = ${pw(b)}.`});
const mc=(id,sk,st,p,o,h,e)=>{let seed=[...id].reduce((a,c)=>a*31+c.charCodeAt(0),7),r=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648,ix=o.map((_,i)=>i);for(let i=ix.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}add({id,sk,st,k:"mc",p,o:ix.map(i=>o[i]),a:ix.indexOf(0),h,e})};
const nn=(id,sk,st,p,a,h,e,x)=>add({id,sk,st,k:"n",p,a,h,e,...x});
// Skill 1: bits and bytes
mc("1c",1,"c","Which sentence is correct?",["A byte is a group of 8 bits","A bit is a group of 8 bytes","A byte is a single 0 or 1","A bit and a byte are the same"],"A bit is one 0 or 1. A byte is the bigger group.","A bit is one 0 or 1, and a byte is 8 bits together.");
nn("1t1",1,"t","How many bits make <b>one byte</b>?",8,"Look at the doubling table: it stops at the size of a byte.","1 byte = 8 bits.");
pat("1t2","t",2,"(00, 01, 10, 11)");pat("1t3","t",3);
nn("1t4",1,"t","A byte has 8 bits, so 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2. How many patterns?",256,"Keep doubling: 2, 4, 8, 16, 32, 64, 128 …","Eight 2s multiplied make 256.");
nn("1t5",1,"t","Patterns start counting at <b>0</b>. What is the <b>largest number</b> one byte can show?",255,"There are 256 patterns and the first is 0. The last is 256 − 1.","0 is a pattern too, so 256 patterns run from 0 to 255.");
mc("1s1",1,"s","Why do computers use <b>binary</b>?",["They are built from switches that are ON or OFF","They are bad at maths","0 and 1 look cool","Decimal is illegal"]);
pat("1s2","s",4);pat("1s3","s",5);
nn("1s4",1,"s","How many <b>bytes</b> are in 24 bits?",3);
nn("1s5",1,"s","What is the <b>smallest</b> number one byte can show?",0);
mc("1s6",1,"s","Why is the biggest number in one byte 255 and <b>not</b> 256?",["There are 256 patterns but counting starts at 0","Bytes can’t count past 255 for no reason","256 is unlucky","Because 8 × 32 = 256"]);
// Skill 2: binary workout
nn("2c",2,"c","What is the place value of the <b>4th bit from the right</b>?",8,"From the right: 1, 2, 4 … keep doubling.","1, 2, 4, 8: the 4th from the right is 8.");
["00001011","10000001","01100100"].forEach((s,i)=>add({id:"2t"+(i+1),sk:2,st:"t",k:"b2d",bits:s,p:`Convert <b>${s}</b> to decimal, one bit at a time.`,a:b2d(s)}));
[13,100,200].forEach((n,i)=>add({id:"2t"+(i+4),sk:2,st:"t",k:"d2b",n,p:`Write <b>${n}</b> as 8-bit binary, one place value at a time.`,a:d2b(n)}));
["00000101","00110011","10000000","00001100"].forEach((s,i)=>nn("2s"+(i+1),2,"s",`Convert <b>${s}</b> to decimal.`,b2d(s)));
[5,37,129,255].forEach((n,i)=>nn("2s"+(i+5),2,"s",`Write <b>${n}</b> as 8-bit binary.`,d2b(n),0,0,{bin:1}));
mc("2s9",2,"s","Which is <b>bigger</b>?",["10000000","01111111"]);
// Skill 3: ASCII
mc("3c",3,"c","How does a computer store the letter <b>A</b>?",["As a number","As a tiny picture of an A","As a sound","As a colour"],"Computers only store binary numbers.","Every character is stored as a number. ASCII says which number.");
nn("3t1",3,"t","ASCII: <b>A = 65</b>. What number is <b>B</b>?",66,"B is the next letter, so add 1.","A = 65, B = 66, C = 67 …");
nn("3t2",3,"t","ASCII: <b>a = 97</b>. What number is <b>c</b>?",99,"a = 97, b = 98, c = ?","a = 97, b = 98, c = 99.");
nn("3t3",3,"t","<b>A = 65</b> and <b>a = 97</b>. How far apart are they? (97 − 65)",32,"Use the explorer: only the 32 bit differs.","The gap is 32, so capitals and lowercase differ by one bit.");
mc("3t4",3,"t","Do <b>A</b> and <b>a</b> have the same ASCII number?",["No, they are different characters","Yes, they are the same letter"],"Capital A and small a look different, so they are different characters.","Different characters get different numbers: 65 and 97.");
nn("3t5",3,"t","ASCII uses the numbers 0 to 127. How many <b>different characters</b> is that?",128,"Count from 0 up to 127, so include the 0.","0 to 127 is 128 numbers.");
nn("3s1",3,"s","<b>A = 65</b>. What is the ASCII number of <b>D</b>?",68);
nn("3s2",3,"s","<b>a = 97</b>. What is the ASCII number of <b>d</b>?",100);
nn("3s3",3,"s","<b>A = 65</b>. What is the ASCII number of <b>Z</b>? (Z is the 26th letter)",90);
mc("3s4",3,"s","Which number is the ASCII code for <b>a</b>?",["97","65","32","1"]);
mc("3s5",3,"s","Why does ASCII give <b>A</b> and <b>a</b> different numbers?",["They are different characters","It made a mistake","Only capitals matter","They are the same"]);
// Skill 4: letter to binary
mc("4c",4,"c","What is <b>Step 1</b> when turning a character into binary?",["Find its ASCII number","Write eight 1s","Add 32","Pick an emoji"],"You can’t make binary until you have a number.","First the ASCII number, then convert the number to 8 bits.");
add({id:"4t1",sk:4,st:"t",k:"d2b",n:66,p:"The letter <b>B</b> is ASCII <b>66</b>. Write it as 8 bits, one place value at a time.",a:d2b(66)});
add({id:"4t2",sk:4,st:"t",k:"d2b",n:97,p:"The letter <b>a</b> is ASCII <b>97</b>. Write it as 8 bits.",a:d2b(97)});
add({id:"4t3",sk:4,st:"t",k:"b2d",bits:"01000011",p:"Decode <b>01000011</b>. What ASCII number is it?",a:67});
mc("4t4",4,"t","<b>01000011</b> is 67. Which letter is that? (A = 65)",["C","A","B","D"],"A = 65, B = 66, then …","65 = A, 66 = B, 67 = C.");
nn("4s1",4,"s","Write <b>C</b> (ASCII 67) as 8 bits.",d2b(67),0,0,{bin:1});
nn("4s2",4,"s","Write <b>H</b> (ASCII 72) as 8 bits.",d2b(72),0,0,{bin:1});
nn("4s3",4,"s","Write <b>T</b> (ASCII 84) as 8 bits.",d2b(84),0,0,{bin:1});
mc("4s4",4,"s","🕵️ Decode: <b>01000011 01000001 01010100</b> (67, 65, 84)",["CAT","COT","CUT","BAT"]);
mc("4s5",4,"s","🕵️ Decode: <b>01000100 01001111 01000111</b>",["DOG","DIG","DOT","LOG"]);
mc("4s6",4,"s","How is the letter <b>B</b> (ASCII 66) stored in binary?",["01000010","01000001","01100010","00100010"]);
mc("4s7",4,"s","<b>A</b> = 01000001 and <b>a</b> = 01100001. What is different?",["Only the 32 bit changed","Every bit changed","Only the 1 bit changed","Nothing"]);
// Skill 5: emoji
mc("5c",5,"c","Why can’t <b>one byte</b> store the emoji 😀 (number 128512)?",["One byte only has 256 patterns (0 to 255), far too few","Emojis are pictures, not data","Bytes can’t store numbers","Emojis are deleted"],"Compare 128512 with the biggest number one byte can hold.","128512 is much bigger than 255, so it needs more bytes.");
nn("5t1",5,"t","How many <b>bits</b> are in a byte?",8,"Think of the 8 switches.","8 bits = 1 byte.");
nn("5t2",5,"t","How many <b>patterns</b> can one byte make?",256,"2 × 2 eight times.","2⁸ = 256.");
nn("5t3",5,"t","What is the <b>largest whole number</b> one byte can show?",255,"256 patterns, starting at 0.","0 to 255.");
nn("5t4",5,"t","<b>2 bytes</b> = 16 bits. How many patterns is that? (256 × 256)",65536,"256 × 256. Try 256 × 200 first, then add 256 × 56.","More bytes means many more patterns: 65,536.");
nn("5t5",5,"t","Use the <b>Emoji lab</b>: how many bytes does 😀 use in UTF-8?",4,"Type 😀 into the lab and read the Bytes column.","In UTF-8 the grinning face uses 4 bytes (32 bits).");
nn("5s1",5,"s","In ASCII each letter is 1 byte. How many <b>bytes</b> is the word <b>HELLO</b>?",5);
nn("5s2",5,"s","A message has <b>6 letters</b> (1 byte each) and <b>2 emojis</b> (4 bytes each). How many bytes in total?",14);
mc("5s3",5,"s","What is the difference between <b>ASCII</b> and <b>Unicode</b>?",["Unicode covers over 100,000 characters including emojis, ASCII only 128","ASCII has more characters than Unicode","They are exactly the same","Unicode only has numbers"]);
mc("5s4",5,"s","Which needs <b>more bytes</b> in UTF-8?",["😀","A","a","!"]);
nn("5s5",5,"s","32 bits is how many <b>bytes</b>?",4);
mc("5s6",5,"s","Unicode gives every character a ____ . UTF-8 turns that into ____ .",["a number; bytes","a colour; pixels","a sound; waves","a name; letters"]);
</script>


<script id="ui">

 return `<svg viewBox="0 0 700 700" style="max-width:520px;width:100%" role="img" aria-label="Bracelet spelling ${esc(L.join(""))} in binary">${o}<text x="350" y="350" text-anchor="middle" dominant-baseline="central" font-size="52" font-weight="800" fill="var(--ink)">${esc(L.join(""))}</text></svg>`}
function bzone(){const L=bcl();if(!L.length)return `<div class="fb info">Type your name above to start! Use letters, numbers or symbols (no emojis: they need more than one byte 😉).</div>`;
 if(W.bi>=L.length)W.bi=0;
 const rows=L.map(ch=>{const n=ch.charCodeAt(0);return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0"><b style="font-size:1.7em;width:1.1em;text-align:center">${esc(ch)}</b><span class="eq">${n} →</span><span style="display:flex;gap:4px">${bg(n).map(b=>bead(b,30)).join("")}</span><span class="eq">${d2b(n)}</span></div>`}).join("");
 const t=L[W.bi],tn=t.charCodeAt(0),val=parseInt(W.bb.join(""),2),ok=val==tn,kept=W.bb.map((b,i)=>b?PV[i]:0).filter(Boolean);
 return `<div class="qg"><div class="card"><h2>🎨 Pick your bead colours</h2><b>Bead for a 1:</b><br>${sw("b1")}<br><b>Bead for a 0:</b><br>${sw("b0")}<div class="ctr"><button class="btn" onclick="brnd()">🎲 Surprise me</button><button class="btn" onclick="bswap()">🔄 Swap 1 and 0</button></div></div><div class="card ctr">${bsvg(L)}</div></div>
<div class="card"><h2>🔍 Your bracelet, letter by letter</h2><p>Each letter is <b>1 byte = 8 beads</b>, followed by a gold letter bead. Your name is <b>${L.length} byte${L.length>1?"s":""}</b> = <b>${L.length*8} bits</b>. 🧵 A real bracelet needs <b>${L.length*9} beads</b>.</p>${rows}<div class="fb info">💡 Try typing your name with a capital, then all lowercase. The bracelet changes, because <b>A</b> and <b>a</b> have different ASCII numbers!</div></div>
<div class="card"><div class="kicker">YOUR TURN</div><h2>🛠 Build a letter bead by bead</h2><div class="ctr">${L.map((c,i)=>`<button class="btn" style="${i==W.bi?"":"background:var(--card);color:var(--pri)"}" onclick="bpick(${i})">${esc(c)}</button>`).join("")}</div><div class="big">The letter <b>${esc(t)}</b> is ASCII <b>${tn}</b>. Click the beads to switch them on (1) so the place values add up to <b>${tn}</b>.</div><div class="g">${PV.map((p,i)=>`<div class="c"><small>${p}</small><button onclick="btg(${i})" aria-label="bit ${p}" style="width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;background:${W.bb[i]?S.b1:S.b0};border:3px solid var(--ink)"></button></div>`).join("")}</div><div class="big eq">${W.bb.join("")} → ${kept.join(" + ")||0} = <b>${val}</b> → ${val>32&&val<127?esc(String.fromCharCode(val)):"?"}</div><div class="fb ${ok?"ok":"info"}">${ok?`✅ Yes! That’s <b>${esc(t)}</b>. Now pick another letter!`:`Not yet: you have ${val} but need ${tn}. Which place values add up to ${tn}?`}</div></div>`}
const bzr=()=>{const e=$("bz");if(e)e.innerHTML=bzone()};
function bpick(i){W.bi=i;W.bb=Array(8).fill(0);bzr()}
function btg(i){W.bb[i]^=1;bzr();const L=bcl();if(L[W.bi]&&parseInt(W.bb.join(""),2)==L[W.bi].charCodeAt(0))toast()}
function brnd(){S.b1=PAL[Math.floor(Math.random()*PAL.length)];do{S.b0=PAL[Math.floor(Math.random()*PAL.length)]}while(S.b0==S.b1);save();bzr()}
function bswap(){[S.b1,S.b0]=[S.b0,S.b1];save();bzr()}
const brace=()=>`<div class="kicker">CREATE · 💎</div><h1>💎 ASCII bracelet</h1><div class="lo">🎯 Turn your name into binary and design a bracelet that spells it in code.</div><div class="card"><div class="big"><b>1.</b> Type your name or nickname (up to 10 characters).<br><b>2.</b> Each letter becomes <b>8 beads</b>: one colour for a <b>1</b>, another for a <b>0</b>.<br><b>3.</b> A gold bead marks the end of each letter.</div><input type="text" id="bn" maxlength="10" style="font-size:1.4em;max-width:420px" value="${(S.bn||"").replace(/"/g,"&quot;")}" placeholder="Your name" oninput="S.bn=this.value;save();W.bi=0;W.bb=Array(8).fill(0);bzr()"></div><div id="bz">${bzone()}</div><div class="ctr"><button class="btn" onclick="go('g')">🕵️ Play the Decode game ➡</button></div>`;
// ----- pretend Python console -----
function pyev(e){e=e.trim();let m;
 if(m=e.match(/^(.+?)\s*([+-])\s*(\d+)$/)){const a=pyev(m[1]);if(typeof a!="number")throw"TypeError: you can only add numbers to numbers";return m[2]=="+"?a+ +m[3]:a-m[3]}
 if(m=e.match(/^(["'])(.*)\1$/))return m[2];
 if(/^\d+$/.test(e))return +e;
 if(m=e.match(/^ord\((.*)\)$/)){const s=pyev(m[1]);if(typeof s!="string"||Array.from(s).length!=1)throw"TypeError: ord() needs exactly ONE character inside quote marks";return s.codePointAt(0)}
 if(m=e.match(/^chr\((.*)\)$/)){const n=pyev(m[1]);if(typeof n!="number"||n>1114111)throw"TypeError: chr() needs a number";return String.fromCodePoint(n)}
 if(m=e.match(/^format\((.+),\s*(["'])08b\2\)$/)){const n=pyev(m[1]);if(typeof n!="number")throw"TypeError: format() needs a number first";return n.toString(2).padStart(8,"0")}
 if(m=e.match(/^int\((["'])([01]+)\1,\s*2\)$/))return parseInt(m[2],2);
 throw'SyntaxError: check your ( ) brackets and " " quote marks. This lab knows ord, chr, format, int and print.'}
const PS=[`ord("A")`,`ord("a")`,`chr(72)`,`int("01001000", 2)`,`format(ord("A"), "08b")`,`ord("😀")`];
const PMI=[[`Find the number for <b>A</b>. Type <code>ord("A")</code>`,(i,o)=>/ord\(/.test(i)&&o=="65"],
[`Find the ASCII number of the <b>first letter of your bracelet name</b>.`,(i,o)=>/ord\(/.test(i)&&o==String((bcl()[0]||"A").charCodeAt(0))],
[`Turn binary into a number: <code>int("01001000", 2)</code>. The 2 means “base 2”.`,(i,o)=>/int\(/.test(i)&&o=="72"],
[`Number to letter! <code>chr()</code> does the opposite of <code>ord()</code>. Which letter is 72?`,(i,o)=>/chr\(/.test(i)&&o=="H"],
[`Skill 4 in one line! Get <b>A</b> as 8 bits: <code>format(ord("A"), "08b")</code>`,(i,o)=>/format\(/.test(i)&&o=="01000001"],
[`The emoji problem: find the number for 😀. Is it bigger than 255?`,(i,o)=>/ord\(/.test(i)&&o=="128512"]];
const pymH=()=>PMI.map((m,i)=>`<div class="big" style="margin:6px 0;${W.pd[i]?"background:var(--okb);color:var(--ok)":""}">${W.pd[i]?"✅":"⬜"} <b>Mission ${i+1}:</b> ${m[0]}</div>`).join("")+(Object.keys(W.pd).length==PMI.length?`<div class="fb ok">🎉 All missions done! Python did in a blink what took us a whole lesson. 🐍</div>`:"");
const pyoH=()=>`<div style="background:#0b1030;color:#7bf0ad;font:20px/1.5 ui-monospace,Consolas,monospace;border-radius:12px;padding:14px 18px;min-height:90px;max-height:260px;overflow:auto">`+(W.ph.length?W.ph.map(h=>`<div style="color:#fff">&gt;&gt;&gt; ${esc(h.i)}</div><div style="${h.e?"color:#ffa3a3":""}">${esc(h.o)}</div>`).join(""):`<span style="color:#a9b3d6">A pretend Python console. Type below ⬇</span>`)+`</div>`;
const pyui=()=>`<div class="kicker">PYTHON LAB · 🐍</div><h2>Can Python do this for us?</h2><p>You’ve used Python to draw with turtle. Now let’s use it on <b>text</b>! This is a pretend console: type a line, then press <b>Run</b>. Predict the answer first, and check it against what you’ve learned.</p><div id="pym">${pymH()}</div><div id="pyo">${pyoH()}</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input type="text" id="pyi" style="flex:1 1 300px;font-family:ui-monospace,Consolas,monospace" placeholder='Type Python here, e.g. ord("A")' autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')pyrun()"><button class="btn" onclick="pyrun()">▶ Run</button></div><p style="margin-bottom:0"><small>Stuck typing quotes? Tap a button to fill the line, then press Run (or edit it first!):</small></p><div>${PS.map((p,i)=>`<button class="btn" style="background:var(--card);color:var(--pri);font-family:ui-monospace,Consolas,monospace;padding:6px 12px;margin:4px" onclick="pyfill(${i})">${esc(p)}</button>`).join("")}</div>`;
function pyfill(i){const e=$("pyi");e.value=PS[i];e.focus()}
function pyrun(){const el=$("pyi"),s=el.value.trim();if(!s)return;let o,e=0;
 try{let x=s,p=0;const m=x.match(/^print\((.*)\)$/);if(m){x=m[1];p=1}const v=pyev(x);o=p||typeof v!="string"?String(v):"'"+v+"'"}catch(z){e=1;o=typeof z=="string"?z:"SyntaxError: check your ( ) brackets and quote marks"}
 W.ph.push({i:s,o,e});let nw=0;if(!e)PMI.forEach((m,i)=>{if(!W.pd[i]&&m[1](s,o)){W.pd[i]=1;nw=1}});
 $("pyo").innerHTML=pyoH();$("pym").innerHTML=pymH();el.value="";el.focus();const b=$("pyo").firstChild;b.scrollTop=b.scrollHeight;if(nw)toast()}

render();
try{window.claude.use("downloads").then(d=>{if(d){DL=d;if(S.pg=="h")render()}}).catch(()=>{})}catch(e){}
</script></body></html>
